<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-labelledby="title desc">
  <title id="title">Daily operating loop</title>
  <desc id="desc">Six steps in a day: pre-market brief, open run, wash-sale gate, journal, weekly PDF, board review.</desc>
  <rect width="760" height="280" fill="#f7f8f7"/>
  <text x="28" y="36" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="18" fill="#172b45">Daily operating loop</text>
  <text x="28" y="58" font-family="'Source Sans 3', system-ui, sans-serif" font-size="13" fill="#536476">Sanitized diagram. No account data.</text>

  <!-- boxes -->
  <g font-family="'IBM Plex Sans', system-ui, sans-serif">
    <rect x="28" y="90" width="100" height="72" rx="6" fill="#ffffff" stroke="#496782" stroke-width="1.5"/>
    <text x="78" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#172b45">Pre-market</text>
    <text x="78" y="138" text-anchor="middle" font-size="11" fill="#536476">brief</text>

    <rect x="158" y="90" width="100" height="72" rx="6" fill="#ffffff" stroke="#496782" stroke-width="1.5"/>
    <text x="208" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#172b45">Open run</text>
    <text x="208" y="138" text-anchor="middle" font-size="11" fill="#536476">limit buys</text>

    <rect x="288" y="90" width="100" height="72" rx="6" fill="#ffffff" stroke="#496782" stroke-width="1.5"/>
    <text x="338" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#172b45">Wash-sale</text>
    <text x="338" y="138" text-anchor="middle" font-size="11" fill="#536476">gate</text>

    <rect x="418" y="90" width="100" height="72" rx="6" fill="#ffffff" stroke="#496782" stroke-width="1.5"/>
    <text x="468" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#172b45">Journal</text>
    <text x="468" y="138" text-anchor="middle" font-size="11" fill="#536476">every action</text>

    <rect x="548" y="90" width="100" height="72" rx="6" fill="#ffffff" stroke="#496782" stroke-width="1.5"/>
    <text x="598" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#172b45">Weekly PDF</text>
    <text x="598" y="138" text-anchor="middle" font-size="11" fill="#536476">Friday packet</text>

    <rect x="330" y="190" width="100" height="72" rx="6" fill="#172b45" stroke="#172b45" stroke-width="1.5"/>
    <text x="380" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Board review</text>
    <text x="380" y="238" text-anchor="middle" font-size="11" fill="#b9cad8">six models</text>
  </g>

  <!-- arrows top row -->
  <g stroke="#496782" stroke-width="1.5" fill="none">
    <path d="M128 126 H158" marker-end="url(#arr)"/>
    <path d="M258 126 H288" marker-end="url(#arr)"/>
    <path d="M388 126 H418" marker-end="url(#arr)"/>
    <path d="M518 126 H548" marker-end="url(#arr)"/>
    <path d="M598 162 V176 H380 V190" marker-end="url(#arr)"/>
  </g>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#496782"/>
    </marker>
  </defs>
</svg>
