<title id="t">Share of residents within 3 miles of a branch</title>
<rect width="760" height="360" fill="#f7f5f0"/>
<text x="32" y="36" font-family="Georgia, serif" font-size="18" fill="#1b1f23">Residents within 3 straight-line miles</text>
<text x="32" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#5a6169">Greater Cincinnati, 7 counties. 2,089,394 residents. A person can be near more than one credit union.</text>
