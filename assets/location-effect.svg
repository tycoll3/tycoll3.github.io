<text x="32" y="36" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="18" fill="#172b45">Did the answer recommend GECU?</text><text x="32" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#536476">Oct 8, 2026. Discovery questions, which do not name GECU. One run.</text><text x="32" y="116" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#172b45">Located: “I’m in Cincinnati.”</text><text x="32" y="136" font-family="ui-monospace, monospace" font-size="12" fill="#536476">41 of 87</text><rect x="300" y="100" width="340" height="28" fill="#e7ecef"/><rect x="300" y="100" width="159.8" height="28" fill="#496782"/><text x="650" y="119" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#172b45">47%</text><text x="32" y="186" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#172b45">Unlocated: no place in the question</text><text x="32" y="206" font-family="ui-monospace, monospace" font-size="12" fill="#536476">0 of 85</text><rect x="300" y="170" width="340" height="28" fill="#e7ecef"/><text x="650" y="189" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#172b45">0%</text></svg>